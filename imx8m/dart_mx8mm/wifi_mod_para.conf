# mwifiex configuration for Android, one block per supported chip:
# - SD8987: NXP 88W8987, same values as NXP's reference configuration
#   vendor/nxp/imx-firmware/android_wifi_mod_para.conf
# - SDIW612: NXP IW612 (SOM revision 2.x and later), Variscite values
#   from Android 15
# For details, refer to the mxm_wifiex/wlan_src/README file in the module
# source directory.
SD8987 = {
	sta_name=wlan
	uap_name=wlan
	wfd_name=p2p
	max_vir_bss=1
	cal_data_cfg=none
	fw_name=sduart8987_combo.bin
}

SDIW612 = {
	cfg80211_wext=0xf
	sta_name=wlan
	uap_name=wlan
	wfd_name=p2p
	max_vir_bss=1
	cal_data_cfg=none
	ps_mode=2
	auto_ds=2
	fw_name=sduart_nw61x_v1.bin.se
	fw_serial=0
	cntry_txpwr=2
	country_ie_ignore=1
	beacon_hints=1
	slew_rate=2
	host_mlme=1
	drvdbg=0x206
}
